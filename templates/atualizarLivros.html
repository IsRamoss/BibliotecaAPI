    {% extends 'base.html' %}

    {% block titulo %}
    <h1>Criar Livro</h1>
    {% endblock %}

    {% block conteudo %}

    <h2>Atualizar Novo Livro</h2>

    <form action="{{ url_for('atualizar_livro', isbn=livro.isbn) }}" method="POST">
        <input type="hidden" name="acao" value="atualizar">
        <label>ISBN:
            <input type="number" name="isbn" value="{{ livro['isbn'] }}" required>
        </label>
        <br>
        
        <label>Título:
            <input type="text" name="titulo" value="{{ livro['titulo'] }}" required>
        </label>
        <br>
        
        <label>Autor:
            <input type="text" name="autor" value="{{ livro['autor'] }}" required>
        </label>
        <br>
        
        <label>Gênero:
            <input type="text" name="genero" value="{{ livro['genero'] }}" required>
        </label>
        <br>
        
        <label>Ano Publicação:
            <input type="number" name="ano_publicacao" value="{{ livro['ano_publicacao'] }}" required>
        </label>
        <br>
        
        <label>Editora:
            <input type="text" name="editora" value="{{ livro['editora'] }}" required>
        </label>
        <br>
        
        <label>Páginas:
            <input type="number" name="paginas" value="{{ livro['paginas'] }}" required>
        </label>
        <br>
        
        <label>Status:
            <input type="text" name="status" value="{{ livro['status'] }}" required>
        </label>
        <br>
        
        <label>Localização:
            <input type="text" name="localizacao" value="{{ livro['localizacao'] }}" required>
        </label>
        <button type="submit" >Salvar Livro</button>

    </form>

    {% endblock %}
